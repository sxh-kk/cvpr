[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egomotion-pipeline"
version = "1.0.0"
description = "Original-camera native30Hz DINO extraction for accepted SMPL-H archives"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyarrow>=15", "av>=12", "Pillow>=10", "mcap>=1.2,<2", "mcap-protobuf-support>=0.5,<1"]

[project.optional-dependencies]
dino = ["torch>=2.2", "transformers>=4.48,<5", "cvpr-image-process>=1.0.0"]
aria = ["projectaria-tools>=1.5"]
test = ["pytest>=8"]

[project.scripts]
egomotion-pipeline = "egomotion_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]
