[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "motionexpert"
version = "0.2.0"
description = "SMPL-H K12 motion expert with explicit hands21 supervision"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
audit = ["mcap>=1.2,<2", "protobuf", "scipy"]
plot = ["matplotlib>=3.7,<4"]

[project.scripts]
motionexpert-train = "MotionExpert.train:main"
motionexpert-infer = "MotionExpert.infer:main"
motionexpert-export = "MotionExpert.export_weights:main"
motionexpert-stats = "MotionExpert.compute_joint_motion_stats:main"
motionexpert-eval = "MotionExpert.evaluate:main"

[tool.setuptools]
packages = ["MotionExpert", "MotionExpert.dataset", "MotionExpert.model", "MotionExpert.module", "MotionExpert.mydiffusion", "MotionExpert.utils"]
package-dir = {MotionExpert = "."}

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.package-data]
MotionExpert = ["configs/*.yaml"]
