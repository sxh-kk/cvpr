[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egomotion-pipeline"
version = "0.7.0"
description = "EgoExo4D-HM and EgoSuite to a 30 Hz LeRobot motion archive"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3,<2", "pyarrow>=15", "av>=12", "Pillow>=9", "mcap>=1.2,<2", "mcap-protobuf-support>=0.5,<1"]

[project.optional-dependencies]
dino = ["torch>=2.2", "transformers>=4.48,<5"]
aria = ["projectaria-tools>=1.5"]
model-pickle = ["scipy>=1.10"]
smpl-fit = ["torch>=2.2", "scipy>=1.10", "matplotlib>=3.7", "smplx==0.1.28"]
test = ["pytest>=8", "datasets>=3,<5", "pandas>=2"]

[project.scripts]
egomotion-pipeline = "egomotion_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
