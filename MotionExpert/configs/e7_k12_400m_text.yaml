# Fine-tune the final stable text-conditioned E7 K12 400M model.
DATA:
  DATA_DIR: ../datasets/ee4d_motion_uniegomotion
  DATASET_NAME: ee4d_nymeria
  EE4D_PACK: uniegomotion/ee_{split}.pt
  EE4D_DINO_PACK: uniegomotion/egoview_dinov2_{split}.pt
  NYMERIA_PACK: uniegomotion/nymeria_{split}.pt
  NYMERIA_DINO_PACK: uniegomotion/egoview_dinov2_nymeria_{split}.pt
  TEXT_FEATURES_PATH: uniegomotion/clip_text_{split}_16.pt
  STATS_PATH: uniegomotion/v4_beta_joint_masked_train_stats_clean.pt
  STATS_MODE: joint_masked
  SEQUENCE_MANIFEST: uniegomotion/motion_qc_{split}.json
  COND_TEXT: true
  TEXT_FEATURE_DIM: 768
  TEXT_TOKEN_COUNT: 16
  TEXT_DROPOUT: 0.10
  COND_IMG_FEAT: true
  IMG_FEAT_TYPE: dinov2
  BATCH_SIZE: 16
  NUM_WORKERS: 8
  MMAP_MOTION_PACKS: true
  PIN_MEMORY: true
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  DROP_LAST: true
  SOURCE_BALANCE: true
  EE4D_SAMPLE_WEIGHT: 1.0
  NYMERIA_SAMPLE_WEIGHT: 1.0
  SOURCE_SUBSAMPLE:
    ENABLED: true
    EE4D_FRACTION: 0.5
    NYMERIA_FRACTION: 0.5
    SEED: 62
  EXCLUDE_TERRAIN: false
  SANITIZE_NONFINITE: true
  NORMALIZATION_CLIP: 8.0
MODEL:
  INIT_CKPT_PATH: weights/e7_k12_400m_text_ema_fp32.pt
  MOTION_EXPERT:
    # Already trained; fine-tuning begins with all active parameters exposed.
    SHARED_UNFREEZE_EPOCH: 0
    UNFREEZE_RAMP_EPOCHS: 0
    ROUTED_LR_SCALE: 0.5
    TEXT_LR_SCALE: 0.25
    UNFROZEN_LR_SCALE: 0.25
    LOAD_BALANCE_WEIGHT: 0.005
TRAIN:
  EXP_PATH: exp/e7_k12_400m_text
  LR: 1.5e-5
  SEED: 62
  USE_CKPT_LR: true
  WEIGHT_DECAY: 0.01
  NUM_EPOCHS: 300
  NUM_GPUS: 8
  PRECISION: bf16-mixed
  ACCUMULATE_GRAD_BATCHES: 4
  GRADIENT_CLIP_VAL: 1.0
  EMA_DECAY: 0.992028
  WARMUP_EPOCHS: 20
  MIN_LR_RATIO: 0.1
  NUM_SANITY_VAL_STEPS: 0
  LOG_EVERY_N_STEPS: 10
  PROGRESS_REFRESH_RATE: 10
  CHECK_VAL_EVERY_N_EPOCHS: 10
  SAVE_EVERY_N_EPOCHS: 50
